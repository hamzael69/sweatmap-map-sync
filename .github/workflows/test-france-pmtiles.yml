name: Test France PMTiles

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: "Latitude de test"
        required: true
        default: "45.4397"
      longitude:
        description: "Longitude de test"
        required: true
        default: "4.3872"

jobs:
  test-pmtiles:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          mkdir pmtiles-test
          cd pmtiles-test
          npm init -y
          npm install pmtiles @mapbox/vector-tile pbf

      - name: Create PMTiles nearest road test
        run: |
          cd pmtiles-test

          cat > test.mjs <<'EOF'
          import { PMTiles } from "pmtiles";
          import { VectorTile } from "@mapbox/vector-tile";
          import { PbfReader } from "pbf";

          const url =
            "https://huggingface.co/datasets/yatso6/sweatmap-france-map-v1/resolve/main/france-v1.pmtiles";

          const lat = Number(process.env.TEST_LAT);
          const lon = Number(process.env.TEST_LON);

          const z = 14;

          function lonToTileX(lon, zoom) {
            return Math.floor(((lon + 180) / 360) * 2 ** zoom);
          }

          function latToTileY(lat, zoom) {
            const rad = (lat * Math.PI) / 180;

            return Math.floor(
              ((1 - Math.asinh(Math.tan(rad)) / Math.PI) / 2) *
                2 ** zoom
            );
          }

          function projectToMeters(coord, referenceLat, referenceLon) {
            const [coordLon, coordLat] = coord;

            const metersPerDegreeLat = 111320;
            const metersPerDegreeLon =
              111320 * Math.cos((referenceLat * Math.PI) / 180);

            return {
              x: (coordLon - referenceLon) * metersPerDegreeLon,
              y: (coordLat - referenceLat) * metersPerDegreeLat,
            };
          }

          function closestPointOnSegment(a, b) {
            const abX = b.x - a.x;
            const abY = b.y - a.y;

            const lengthSquared =
              abX * abX + abY * abY;

            if (lengthSquared === 0) {
              return {
                x: a.x,
                y: a.y,
                distance: Math.sqrt(a.x * a.x + a.y * a.y),
              };
            }

            let t =
              -(a.x * abX + a.y * abY) /
              lengthSquared;

            t = Math.max(0, Math.min(1, t));

            const x = a.x + t * abX;
            const y = a.y + t * abY;

            return {
              x,
              y,
              distance: Math.sqrt(x * x + y * y),
            };
          }

          function distanceToLineString(coordinates) {
            let minDistance = Infinity;

            for (let i = 0; i < coordinates.length - 1; i++) {
              const a = projectToMeters(
                coordinates[i],
                lat,
                lon
              );

              const b = projectToMeters(
                coordinates[i + 1],
                lat,
                lon
              );

              const closest = closestPointOnSegment(a, b);

              if (closest.distance < minDistance) {
                minDistance = closest.distance;
              }
            }

            return minDistance;
          }

          function distanceToGeometry(geometry) {
            if (geometry.type === "LineString") {
              return distanceToLineString(
                geometry.coordinates
              );
            }

            if (geometry.type === "MultiLineString") {
              let minDistance = Infinity;

              for (const line of geometry.coordinates) {
                const distance = distanceToLineString(line);

                if (distance < minDistance) {
                  minDistance = distance;
                }
              }

              return minDistance;
            }

            return Infinity;
          }

          const usableKinds = new Set([
            "residential",
            "living_street",
            "pedestrian",
            "footway",
            "path",
            "track",
            "service",
            "unclassified",
            "tertiary",
            "secondary",
            "primary",
            "steps",
            "cycleway",
          ]);

          const centerX = lonToTileX(lon, z);
          const centerY = latToTileY(lat, z);

          console.log("");
          console.log("=== SWEATMAP PMTILES NEAREST ROAD TEST ===");
          console.log("");
          console.log("Position GPS :", lat, lon);
          console.log(
            "Tuile centrale :",
            `${z}/${centerX}/${centerY}`
          );
          console.log("");

          const archive = new PMTiles(url);

          console.log("Lecture du header PMTiles...");

          const header = await archive.getHeader();

          console.log("PMTiles OK");
          console.log("Min zoom :", header.minZoom);
          console.log("Max zoom :", header.maxZoom);
          console.log("");

          const candidates = [];

          /*
           * On lit la tuile centrale + les 8 voisines.
           * Ça évite un problème si le GPS est proche
           * du bord d'une tuile.
           */
          for (let offsetX = -1; offsetX <= 1; offsetX++) {
            for (let offsetY = -1; offsetY <= 1; offsetY++) {
              const tileX = centerX + offsetX;
              const tileY = centerY + offsetY;

              const tile = await archive.getZxy(
                z,
                tileX,
                tileY
              );

              if (!tile) {
                continue;
              }

              const vectorTile = new VectorTile(
                new PbfReader(
                  new Uint8Array(tile.data)
                )
              );

              const streets =
                vectorTile.layers.streets;

              if (!streets) {
                continue;
              }

              for (let i = 0; i < streets.length; i++) {
                const feature = streets.feature(i);

                const geojson = feature.toGeoJSON(
                  tileX,
                  tileY,
                  z
                );

                const kind =
                  geojson.properties?.kind ??
                  "unknown";

                if (!usableKinds.has(kind)) {
                  continue;
                }

                const distance =
                  distanceToGeometry(
                    geojson.geometry
                  );

                if (!Number.isFinite(distance)) {
                  continue;
                }

                candidates.push({
                  distance,
                  kind,
                  featureId:
                    feature.id ?? null,
                  properties:
                    geojson.properties ?? {},
                  geometry:
                    geojson.geometry,
                  tile: `${z}/${tileX}/${tileY}`,
                });
              }
            }
          }

          candidates.sort(
            (a, b) =>
              a.distance - b.distance
          );

          console.log(
            "Routes candidates trouvées :",
            candidates.length
          );

          console.log("");

          if (candidates.length === 0) {
            throw new Error(
              "Aucune route utilisable trouvée autour du GPS."
            );
          }

          const nearest = candidates[0];

          console.log("=== ROUTE LA PLUS PROCHE ===");
          console.log("");
          console.log(
            "Distance GPS → route :",
            nearest.distance.toFixed(2),
            "m"
          );
          console.log(
            "Type de route :",
            nearest.kind
          );
          console.log(
            "Tuile :",
            nearest.tile
          );
          console.log(
            "Feature ID :",
            nearest.featureId
          );

          console.log("");
          console.log("Propriétés :");
          console.log(
            JSON.stringify(
              nearest.properties,
              null,
              2
            )
          );

          console.log("");
          console.log("Géométrie :");
          console.log(
            nearest.geometry.type
          );

          if (
            nearest.geometry.type ===
            "LineString"
          ) {
            console.log(
              "Nombre de points :",
              nearest.geometry.coordinates.length
            );

            console.log(
              "Premier point :",
              nearest.geometry.coordinates[0]
            );

            console.log(
              "Dernier point :",
              nearest.geometry.coordinates[
                nearest.geometry.coordinates.length - 1
              ]
            );
          }

          console.log("");
          console.log(
            "=== 10 ROUTES LES PLUS PROCHES ==="
          );

          for (
            const candidate
            of candidates.slice(0, 10)
          ) {
            console.log(
              `${candidate.distance.toFixed(2)} m | ${candidate.kind} | ${candidate.tile}`
            );
          }

          console.log("");
          console.log("================================");
          console.log(
            "✅ ROUTE PMTILES TROUVÉE DEPUIS LE GPS"
          );
          console.log("================================");
          EOF

      - name: Find nearest road from GPS
        env:
          TEST_LAT: ${{ inputs.latitude }}
          TEST_LON: ${{ inputs.longitude }}
        run: |
          cd pmtiles-test
          node test.mjs